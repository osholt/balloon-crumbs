name: Server CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SERVER_DIR: apps/server

jobs:
  quality:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: ${{ env.SERVER_DIR }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - name: Audit Python dependencies
        # The relay itself is an editable local package, not a PyPI dependency.
        # Vulnerabilities still fail the command; only that local package is skipped.
        run: uv run pip-audit --skip-editable
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run ruff format --check ../../tools/road-data ../../tools/tester_notify ../../tools/simulation
      - run: uv run ruff check ../../tools/road-data ../../tools/tester_notify ../../tools/simulation
      - run: cd ../.. && python3 -m unittest discover -s tools/road-data/tests -v
      - run: cd ../.. && python3 -m unittest discover -s tools/tester_notify/tests -v
      - name: Test pilot planner forecast logic
        run: |
          cd ../..
          node --test \
            apps/planner/planner-core.test.mjs \
            apps/planner/pages-worker.test.mjs
          node --check apps/planner/app.js
          node --check apps/planner/_worker.js
      - run: uv run pytest --cov=balloon_crumbs_server --cov-report=term-missing --cov-fail-under=80

  postgres-migration:
    name: PostgreSQL migration smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: balloon_crumbs
          POSTGRES_USER: balloon_crumbs
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U balloon_crumbs -d balloon_crumbs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ${{ env.SERVER_DIR }}
    env:
      BALLOON_CRUMBS_DATABASE_URL: postgresql+psycopg://balloon_crumbs:ci-only-password@127.0.0.1:5432/balloon_crumbs
      BALLOON_CRUMBS_DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
      BALLOON_CRUMBS_CURSOR_SIGNING_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          working-directory: ${{ env.SERVER_DIR }}
          python-version: '3.12'
          enable-cache: true
      - run: uv sync --frozen --no-dev
      - run: uv run alembic upgrade head
      # The only place migrations run against the engine production uses; the
      # unit tests use SQLite. Asserts both directions, because each has caught
      # a real mistake: that migrations create what the relay needs, and that
      # the tables 0011 dropped stay dropped.
      - run: |
          uv run python - <<'PY'
          from sqlalchemy import create_engine, inspect

          from balloon_crumbs_server.config import get_settings

          tables = set(inspect(create_engine(get_settings().database_url)).get_table_names())

          missing = {
              "rides",
              "ride_events",
              "ride_members",
              "idempotency_replays",
              "ride_plans",
          } - tables
          assert not missing, f"migrations did not create: {sorted(missing)}"

          # Withdrawn with the discovery API (#21). Asserted absent rather than
          # simply unlisted, so a reverted migration or a reintroduced ORM class
          # fails here on real Postgres rather than on a deploy.
          revived = sorted(name for name in tables if name.startswith("discovery"))
          assert not revived, f"discovery tables are back: {revived}"
          PY

  container:
    name: Container build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build --tag balloon-crumbs-server:ci apps/server
      - name: Validate tailnet deployment
        env:
          POSTGRES_PASSWORD: ci-only-password
          BALLOON_CRUMBS_CURSOR_SIGNING_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
          BALLOON_CRUMBS_DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
          BALLOON_CRUMBS_DOMAIN: balloon-crumbs.example.ts.net
        run: >-
          docker compose
          --file deploy/compose.yaml
          --file deploy/compose.tailnet.yaml
          config --quiet
      - name: Validate isolated pre-production deployment
        env:
          POSTGRES_PASSWORD: production-ci-only-password
          BALLOON_CRUMBS_CURSOR_SIGNING_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
          BALLOON_CRUMBS_DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
          BALLOON_CRUMBS_DOMAIN: relay.example.com
          BALLOON_CRUMBS_PREPRODUCTION_DOMAIN: preprod-relay.example.com
          PREPRODUCTION_POSTGRES_PASSWORD: preproduction-ci-only-password
          PREPRODUCTION_BALLOON_CRUMBS_CURSOR_SIGNING_KEY: DQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0NDQ0
          PREPRODUCTION_BALLOON_CRUMBS_DATA_ENCRYPTION_KEY: Dg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4ODg4
        run: |
          docker compose --file deploy/compose.preproduction.yaml config --quiet
          docker compose \
            --file deploy/compose.yaml \
            --file deploy/compose.preproduction-proxy.yaml \
            config --quiet
          docker run --rm \
            --env BALLOON_CRUMBS_DOMAIN \
            --env BALLOON_CRUMBS_PREPRODUCTION_DOMAIN \
            --volume "$PWD/deploy/Caddyfile.preproduction:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
      - name: Validate isolated Oracle deployment
        env:
          POSTGRES_PASSWORD: oracle-ci-only-password
          BALLOON_CRUMBS_CURSOR_SIGNING_KEY: CwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCws
          BALLOON_CRUMBS_DATA_ENCRYPTION_KEY: BwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwcHBwc
          BALLOON_CRUMBS_DOMAIN: relay.balloon-crumbs.example.com
          BALLOON_CRUMBS_OPENAIP_API_KEY: ci-only-key
          BALLOON_CRUMBS_OS_MAPS_API_KEY: ci-only-key
        run: |
          docker compose \
            --file deploy/compose.yaml \
            --file deploy/compose.oracle.yaml \
            config --quiet
          docker run --rm \
            --env BALLOON_CRUMBS_OPENAIP_API_KEY \
            --env BALLOON_CRUMBS_OS_MAPS_API_KEY \
            --volume "$PWD/deploy/Caddyfile.oracle:/etc/caddy/Caddyfile:ro" \
            caddy:2.11.4-alpine \
            caddy validate --config /etc/caddy/Caddyfile
