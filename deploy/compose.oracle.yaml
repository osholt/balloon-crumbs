services:
  caddy:
    # TEC's Caddy owns the host's public ports. This Caddy is an isolated
    # Balloon Crumbs edge on the shared TEC network; the public proxy reaches
    # only this alias and never the database or API container directly.
    ports: !reset []
    expose:
      - "8080"
    environment:
      BALLOON_CRUMBS_DOMAIN: ${BALLOON_CRUMBS_DOMAIN:?set BALLOON_CRUMBS_DOMAIN}
      BALLOON_CRUMBS_OPENAIP_API_KEY: ${BALLOON_CRUMBS_OPENAIP_API_KEY:?set BALLOON_CRUMBS_OPENAIP_API_KEY}
      # Optional until an OS Data Hub live project is selected. An empty value
      # leaves the app's ordinary road map working and the client probe declines
      # to enable OS detail.
      BALLOON_CRUMBS_OS_MAPS_API_KEY: ${BALLOON_CRUMBS_OS_MAPS_API_KEY:-}
    volumes:
      - ./Caddyfile.oracle:/etc/caddy/Caddyfile:ro
    networks:
      default: {}
      tec-edge:
        aliases:
          - balloon-crumbs-edge

networks:
  tec-edge:
    external: true
    name: ride-relay_default
