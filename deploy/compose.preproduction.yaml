name: balloon-crumbs-preproduction

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: balloon_crumbs
      POSTGRES_USER: balloon_crumbs
      POSTGRES_PASSWORD: ${PREPRODUCTION_POSTGRES_PASSWORD:?set PREPRODUCTION_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U balloon_crumbs -d balloon_crumbs]
      interval: 5s
      timeout: 5s
      retries: 12

  # Keep this service name distinct from production's `server`. Docker adds
  # the Compose service name as a DNS alias on every attached network; using
  # `server` here would make the production proxy randomly resolve either API.
  preproduction-server:
    build:
      context: ../apps/server
      args:
        BALLOON_CRUMBS_BUILD_COMMIT: ${BALLOON_CRUMBS_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment: &server-environment
      BALLOON_CRUMBS_ENVIRONMENT: preproduction
      BALLOON_CRUMBS_DATABASE_URL: postgresql+psycopg://balloon_crumbs:${PREPRODUCTION_POSTGRES_PASSWORD}@db:5432/balloon_crumbs
      BALLOON_CRUMBS_DATA_ENCRYPTION_KEY: ${PREPRODUCTION_BALLOON_CRUMBS_DATA_ENCRYPTION_KEY:?set PREPRODUCTION_BALLOON_CRUMBS_DATA_ENCRYPTION_KEY}
      BALLOON_CRUMBS_CURSOR_SIGNING_KEY: ${PREPRODUCTION_BALLOON_CRUMBS_CURSOR_SIGNING_KEY:?set PREPRODUCTION_BALLOON_CRUMBS_CURSOR_SIGNING_KEY}
      BALLOON_CRUMBS_APNS_TEAM_ID: ${PREPRODUCTION_BALLOON_CRUMBS_APNS_TEAM_ID:-}
      BALLOON_CRUMBS_APNS_KEY_ID: ${PREPRODUCTION_BALLOON_CRUMBS_APNS_KEY_ID:-}
      BALLOON_CRUMBS_APNS_BUNDLE_ID: ${PREPRODUCTION_BALLOON_CRUMBS_APNS_BUNDLE_ID:-}
      BALLOON_CRUMBS_APNS_PRIVATE_KEY_BASE64: ${PREPRODUCTION_BALLOON_CRUMBS_APNS_PRIVATE_KEY_BASE64:-}
      BALLOON_CRUMBS_APNS_SANDBOX: ${PREPRODUCTION_BALLOON_CRUMBS_APNS_SANDBOX:-true}
      BALLOON_CRUMBS_FCM_PROJECT_ID: ${PREPRODUCTION_BALLOON_CRUMBS_FCM_PROJECT_ID:-}
      BALLOON_CRUMBS_FCM_CLIENT_EMAIL: ${PREPRODUCTION_BALLOON_CRUMBS_FCM_CLIENT_EMAIL:-}
      BALLOON_CRUMBS_FCM_PRIVATE_KEY_BASE64: ${PREPRODUCTION_BALLOON_CRUMBS_FCM_PRIVATE_KEY_BASE64:-}
      BALLOON_CRUMBS_PUSH_DELIVERY_TIMEOUT_SECONDS: ${PREPRODUCTION_BALLOON_CRUMBS_PUSH_DELIVERY_TIMEOUT_SECONDS:-8}
      BALLOON_CRUMBS_DISCOVERY_ADMIN_TOKEN: ${PREPRODUCTION_BALLOON_CRUMBS_DISCOVERY_ADMIN_TOKEN:-}
      BALLOON_CRUMBS_DISCOVERY_ADMIN_NAME: ${PREPRODUCTION_BALLOON_CRUMBS_DISCOVERY_ADMIN_NAME:-preproduction-discovery-admin}
      BALLOON_CRUMBS_DISCOVERY_ALLOWED_ORIGINS: '["https://balloon-crumbs.invalid","https://www.balloon-crumbs.invalid"]'
      BALLOON_CRUMBS_TRUSTED_HOSTS: '["${BALLOON_CRUMBS_PREPRODUCTION_DOMAIN}","127.0.0.1","localhost"]'
      BALLOON_CRUMBS_FORWARDED_ALLOW_IPS: '*'
      BALLOON_CRUMBS_AUTO_CREATE_SCHEMA: 'false'
      BALLOON_CRUMBS_RIDE_RETENTION_HOURS: 72
      BALLOON_CRUMBS_ENDED_RIDE_GRACE_HOURS: 24
      BALLOON_CRUMBS_JOIN_CODE_LOOKUP_RATE_LIMIT_REQUESTS: 30
      BALLOON_CRUMBS_JOIN_CODE_LOOKUP_RATE_LIMIT_WINDOW_SECONDS: 60
      BALLOON_CRUMBS_JOIN_CODE_GLOBAL_RATE_LIMIT_REQUESTS: 20
      BALLOON_CRUMBS_MAXIMUM_ACTIVE_RIDES: ${PREPRODUCTION_BALLOON_CRUMBS_MAXIMUM_ACTIVE_RIDES:-25}
      BALLOON_CRUMBS_MAXIMUM_EVENTS_PER_RIDE: ${PREPRODUCTION_BALLOON_CRUMBS_MAXIMUM_EVENTS_PER_RIDE:-2500}
      BALLOON_CRUMBS_MAXIMUM_STORED_BYTES_PER_RIDE: ${PREPRODUCTION_BALLOON_CRUMBS_MAXIMUM_STORED_BYTES_PER_RIDE:-13107200}
      BALLOON_CRUMBS_MAXIMUM_REPLAYS_PER_RIDE: ${PREPRODUCTION_BALLOON_CRUMBS_MAXIMUM_REPLAYS_PER_RIDE:-2500}
      BALLOON_CRUMBS_MAXIMUM_REPLAY_BYTES_PER_RIDE: ${PREPRODUCTION_BALLOON_CRUMBS_MAXIMUM_REPLAY_BYTES_PER_RIDE:-13107200}
      BALLOON_CRUMBS_TOMTOM_TRAFFIC_API_KEY: ${PREPRODUCTION_BALLOON_CRUMBS_TOMTOM_TRAFFIC_API_KEY:-}
      BALLOON_CRUMBS_TRAFFIC_PROVIDER_TIMEOUT_SECONDS: ${PREPRODUCTION_BALLOON_CRUMBS_TRAFFIC_PROVIDER_TIMEOUT_SECONDS:-8}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_CACHE_SECONDS: ${PREPRODUCTION_BALLOON_CRUMBS_TRAFFIC_INCIDENT_CACHE_SECONDS:-60}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_REQUESTS:-60}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_WINDOW_SECONDS: ${PREPRODUCTION_BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_MAXIMUM_RESPONSE_BYTES: ${PREPRODUCTION_BALLOON_CRUMBS_TRAFFIC_INCIDENT_MAXIMUM_RESPONSE_BYTES:-524288}
      BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_REQUESTS:-120}
      BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_WINDOW_SECONDS: ${PREPRODUCTION_BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_WINDOW_SECONDS:-60}
      BALLOON_CRUMBS_OBSERVER_IP_ABUSE_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_BALLOON_CRUMBS_OBSERVER_IP_ABUSE_RATE_LIMIT_REQUESTS:-5000}
      BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_REQUESTS:-10}
      BALLOON_CRUMBS_OBSERVER_CREATE_IP_ABUSE_RATE_LIMIT_REQUESTS: ${PREPRODUCTION_BALLOON_CRUMBS_OBSERVER_CREATE_IP_ABUSE_RATE_LIMIT_REQUESTS:-500}
      BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_WINDOW_SECONDS: ${PREPRODUCTION_BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_WINDOW_SECONDS:-3600}
      BALLOON_CRUMBS_MAXIMUM_OBSERVER_GRANTS_PER_RIDE: ${PREPRODUCTION_BALLOON_CRUMBS_MAXIMUM_OBSERVER_GRANTS_PER_RIDE:-50}
    networks:
      default:
      relay-proxy:
        aliases:
          - preproduction-server
    depends_on:
      db:
        condition: service_healthy

  cleanup:
    build:
      context: ../apps/server
      args:
        BALLOON_CRUMBS_BUILD_COMMIT: ${BALLOON_CRUMBS_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment: *server-environment
    command:
      - sh
      - -c
      - while true; do .venv/bin/balloon-crumbs-cleanup; sleep 3600; done
    healthcheck:
      disable: true
    depends_on:
      preproduction-server:
        condition: service_healthy

networks:
  relay-proxy:
    name: balloon-crumbs_default
    external: true

volumes:
  postgres-data:
