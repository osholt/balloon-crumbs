name: balloon-crumbs

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: balloon_crumbs
      POSTGRES_USER: balloon_crumbs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U balloon_crumbs -d balloon_crumbs]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ../apps/server
      args:
        BALLOON_CRUMBS_BUILD_COMMIT: ${BALLOON_CRUMBS_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment: &server-environment
      BALLOON_CRUMBS_ENVIRONMENT: production
      BALLOON_CRUMBS_DATABASE_URL: postgresql+psycopg://balloon_crumbs:${POSTGRES_PASSWORD}@db:5432/balloon_crumbs
      BALLOON_CRUMBS_DATA_ENCRYPTION_KEY: ${BALLOON_CRUMBS_DATA_ENCRYPTION_KEY:?set BALLOON_CRUMBS_DATA_ENCRYPTION_KEY}
      BALLOON_CRUMBS_CURSOR_SIGNING_KEY: ${BALLOON_CRUMBS_CURSOR_SIGNING_KEY:?set BALLOON_CRUMBS_CURSOR_SIGNING_KEY}
      BALLOON_CRUMBS_APNS_TEAM_ID: ${BALLOON_CRUMBS_APNS_TEAM_ID:-}
      BALLOON_CRUMBS_APNS_KEY_ID: ${BALLOON_CRUMBS_APNS_KEY_ID:-}
      BALLOON_CRUMBS_APNS_BUNDLE_ID: ${BALLOON_CRUMBS_APNS_BUNDLE_ID:-}
      BALLOON_CRUMBS_APNS_PRIVATE_KEY_BASE64: ${BALLOON_CRUMBS_APNS_PRIVATE_KEY_BASE64:-}
      BALLOON_CRUMBS_APNS_SANDBOX: ${BALLOON_CRUMBS_APNS_SANDBOX:-false}
      BALLOON_CRUMBS_FCM_PROJECT_ID: ${BALLOON_CRUMBS_FCM_PROJECT_ID:-}
      BALLOON_CRUMBS_FCM_CLIENT_EMAIL: ${BALLOON_CRUMBS_FCM_CLIENT_EMAIL:-}
      BALLOON_CRUMBS_FCM_PRIVATE_KEY_BASE64: ${BALLOON_CRUMBS_FCM_PRIVATE_KEY_BASE64:-}
      BALLOON_CRUMBS_PUSH_DELIVERY_TIMEOUT_SECONDS: ${BALLOON_CRUMBS_PUSH_DELIVERY_TIMEOUT_SECONDS:-8}
      BALLOON_CRUMBS_WEB_ALLOWED_ORIGINS: '${BALLOON_CRUMBS_WEB_ALLOWED_ORIGINS:-["https://balloon-crumbs.invalid","https://www.balloon-crumbs.invalid"]}'
      BALLOON_CRUMBS_TRUSTED_HOSTS: '["${BALLOON_CRUMBS_DOMAIN}","127.0.0.1","localhost"]'
      BALLOON_CRUMBS_FORWARDED_ALLOW_IPS: '*'
      BALLOON_CRUMBS_AUTO_CREATE_SCHEMA: 'false'
      BALLOON_CRUMBS_RIDE_RETENTION_HOURS: ${BALLOON_CRUMBS_RIDE_RETENTION_HOURS:-72}
      BALLOON_CRUMBS_ENDED_RIDE_GRACE_HOURS: ${BALLOON_CRUMBS_ENDED_RIDE_GRACE_HOURS:-24}
      BALLOON_CRUMBS_JOIN_CODE_LOOKUP_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_JOIN_CODE_LOOKUP_RATE_LIMIT_REQUESTS:-30}
      BALLOON_CRUMBS_JOIN_CODE_LOOKUP_RATE_LIMIT_WINDOW_SECONDS: ${BALLOON_CRUMBS_JOIN_CODE_LOOKUP_RATE_LIMIT_WINDOW_SECONDS:-60}
      BALLOON_CRUMBS_JOIN_CODE_GLOBAL_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_JOIN_CODE_GLOBAL_RATE_LIMIT_REQUESTS:-20}
      BALLOON_CRUMBS_MAXIMUM_ACTIVE_RIDES: ${BALLOON_CRUMBS_MAXIMUM_ACTIVE_RIDES:-100}
      BALLOON_CRUMBS_MAXIMUM_EVENTS_PER_RIDE: ${BALLOON_CRUMBS_MAXIMUM_EVENTS_PER_RIDE:-5000}
      BALLOON_CRUMBS_MAXIMUM_STORED_BYTES_PER_RIDE: ${BALLOON_CRUMBS_MAXIMUM_STORED_BYTES_PER_RIDE:-26214400}
      BALLOON_CRUMBS_MAXIMUM_REPLAYS_PER_RIDE: ${BALLOON_CRUMBS_MAXIMUM_REPLAYS_PER_RIDE:-5000}
      BALLOON_CRUMBS_MAXIMUM_REPLAY_BYTES_PER_RIDE: ${BALLOON_CRUMBS_MAXIMUM_REPLAY_BYTES_PER_RIDE:-26214400}
      BALLOON_CRUMBS_TOMTOM_TRAFFIC_API_KEY: ${BALLOON_CRUMBS_TOMTOM_TRAFFIC_API_KEY:-}
      BALLOON_CRUMBS_TRAFFIC_PROVIDER_TIMEOUT_SECONDS: ${BALLOON_CRUMBS_TRAFFIC_PROVIDER_TIMEOUT_SECONDS:-8}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_CACHE_SECONDS: ${BALLOON_CRUMBS_TRAFFIC_INCIDENT_CACHE_SECONDS:-60}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_REQUESTS:-60}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_WINDOW_SECONDS: ${BALLOON_CRUMBS_TRAFFIC_INCIDENT_RATE_LIMIT_WINDOW_SECONDS:-60}
      BALLOON_CRUMBS_TRAFFIC_INCIDENT_MAXIMUM_RESPONSE_BYTES: ${BALLOON_CRUMBS_TRAFFIC_INCIDENT_MAXIMUM_RESPONSE_BYTES:-524288}
      BALLOON_CRUMBS_INSPIRE_REFERENCE_PATH: /srv/reference/hmlr/current.sqlite
      BALLOON_CRUMBS_INSPIRE_REFERENCE_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_INSPIRE_REFERENCE_RATE_LIMIT_REQUESTS:-60}
      BALLOON_CRUMBS_INSPIRE_REFERENCE_RATE_LIMIT_WINDOW_SECONDS: ${BALLOON_CRUMBS_INSPIRE_REFERENCE_RATE_LIMIT_WINDOW_SECONDS:-60}
      BALLOON_CRUMBS_INSPIRE_REFERENCE_MAXIMUM_RESPONSE_BYTES: ${BALLOON_CRUMBS_INSPIRE_REFERENCE_MAXIMUM_RESPONSE_BYTES:-393216}
      BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_REQUESTS:-120}
      BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_WINDOW_SECONDS: ${BALLOON_CRUMBS_OBSERVER_READ_RATE_LIMIT_WINDOW_SECONDS:-60}
      BALLOON_CRUMBS_OBSERVER_IP_ABUSE_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_OBSERVER_IP_ABUSE_RATE_LIMIT_REQUESTS:-5000}
      BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_REQUESTS:-10}
      BALLOON_CRUMBS_OBSERVER_CREATE_IP_ABUSE_RATE_LIMIT_REQUESTS: ${BALLOON_CRUMBS_OBSERVER_CREATE_IP_ABUSE_RATE_LIMIT_REQUESTS:-500}
      BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_WINDOW_SECONDS: ${BALLOON_CRUMBS_OBSERVER_CREATE_RATE_LIMIT_WINDOW_SECONDS:-3600}
      BALLOON_CRUMBS_MAXIMUM_OBSERVER_GRANTS_PER_RIDE: ${BALLOON_CRUMBS_MAXIMUM_OBSERVER_GRANTS_PER_RIDE:-50}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./maps/data/hmlr:/srv/reference/hmlr:ro

  cleanup:
    build:
      context: ../apps/server
      args:
        BALLOON_CRUMBS_BUILD_COMMIT: ${BALLOON_CRUMBS_BUILD_COMMIT:-unknown}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    environment: *server-environment
    command:
      - sh
      - -c
      - while true; do .venv/bin/balloon-crumbs-cleanup; sleep 3600; done
    healthcheck:
      disable: true
    depends_on:
      server:
        condition: service_healthy

  martin:
    image: ghcr.io/maplibre/martin:1.11.0
    restart: unless-stopped
    profiles: [maps]
    command: [/data]
    volumes:
      - ./maps/data:/data:ro

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    environment:
      BALLOON_CRUMBS_DOMAIN: ${BALLOON_CRUMBS_DOMAIN:?set BALLOON_CRUMBS_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./maps/styles:/srv/maps/styles:ro
      - ../apps/planner:/srv/planner:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
